name: Packaged extension real-runtime acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/integration/**'
      - 'scripts/*candidate_wheel.py'
      - 'scripts/*candidate_native.py'
      - '.github/workflows/real-runtime.yml'
      - 'src/**'
      - 'package*.json'
permissions:
  contents: read
jobs:
  candidate-identity:
    name: Verify Python/native parser identity parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test and enforce immutable wheel/native provenance equality
        run: |
          python3 -m unittest discover -s scripts -p test_verify_candidate_pair.py
          python3 scripts/verify_candidate_pair.py

  # Each matrix leg must exercise the same VSIX bytes. Repackaging in ten
  # different jobs yields distinct checksums even at the same source SHA.
  package-vsix:
    name: Package one candidate VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
      - name: Build and verify one VSIX
        run: |
          npm ci
          npm run vsix
          vsix="intentumdiff-$(node -p 'require("./package.json").version').vsix"
          test -f "$vsix"
          entry=$(node -p 'require("./package.json").main.replace(/^[.][/]/, "")')
          unzip -l "$vsix" | grep -F "extension/$entry"
          sha256sum "$vsix" > candidate-vsix.sha256
          sha256sum --check candidate-vsix.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rc-candidate-vsix
          path: |
            *.vsix
            candidate-vsix.sha256
          if-no-files-found: error

  acceptance:
    needs: [package-vsix, candidate-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [python, native]
        capture: [capabilities, languages-0, languages-1, languages-2, languages-3]
    env:
      INTENTUMDIFF_ENFORCE_RUST_ONLY_ENGINE: "1"
      INTENTUMDIFF_TEST_RUNTIME_KIND: ${{ matrix.runtime }}
      INTENTUMDIFF_CAPTURE_SET: ${{ matrix.capture }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      # Python #170 source-judged Linux RC artifact (CI run 41198192027; core 076c382b). All five jobs remain a release gate; native uses same wheel bytes. Reuse the tested wheel, not a fresh build
      # against historical parser components. Expired/missing artifacts fail loudly.
      - name: Download and verify reviewed candidate wheel
        if: matrix.runtime == 'python'
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN || github.token }}
        run: |
          python -m unittest discover -s scripts -p test_verify_candidate_wheel.py
          mkdir .candidate-download
          gh api /repos/buchochelliq-labs/intentumdiff-python/actions/artifacts/13043287406/zip > .candidate-download/wheel.zip
          python scripts/verify_candidate_wheel.py .candidate-download/wheel.zip .candidate-wheels
      - name: Install external candidate wheel
        if: matrix.runtime == 'python'
        run: |
          python -m venv .candidate-runtime
          .candidate-runtime/bin/pip install .candidate-wheels/*.whl
          echo "INTENTUMDIFF_TEST_CLI=$PWD/.candidate-runtime/bin/intentumdiff" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          identity = json.loads(Path('.candidate-wheels/runtime-identity.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              for key in ('python_commit', 'core_commit', 'wheel_sha256', 'artifact_id'):
                  env.write(f"INTENTUMDIFF_TEST_{key.upper()}={identity[key]}\n")
          PY
      # Native server #15: exact tested release binary and byte-identical pinned parser components.
      - name: Download and verify native candidate
        if: matrix.runtime == 'native'
        env:
          GH_TOKEN: ${{ secrets.SPLIT_REPO_TOKEN || github.token }}
        run: |
          python -m unittest discover -s scripts -p test_verify_candidate_native.py
          mkdir .candidate-download
          gh api /repos/buchochelliq-labs/intentumdiff-live-server/actions/artifacts/13044028687/zip > .candidate-download/native.zip
          python scripts/verify_candidate_native.py .candidate-download/native.zip .candidate-native \
            --expected-archive-sha256 c76647acb3d39dbe7e71ff1be351148478b8deab045b90ab2f6aa17022f7b3f0 \
            --expected-server-commit ce87bad15e9ba3ba13a4752e14b3b5690eba8afb \
            --expected-core-commit 076c382b9fc1eae1d68bfdbc78e58187fdfd1a83
          echo "INTENTUMDIFF_TEST_CLI=$PWD/.candidate-native/intentumdiff-live-server" >> "$GITHUB_ENV"
          echo "INTENTUMDIFF_TEST_NATIVE_ARTIFACT_ID=13044028687" >> "$GITHUB_ENV"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          identity = json.loads(Path('.candidate-native/runtime-identity.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"INTENTUMDIFF_TEST_NATIVE_SERVER_COMMIT={identity['server_commit']}\n")
              env.write(f"INTENTUMDIFF_TEST_CORE_COMMIT={identity['core_commit']}\n")
          PYTHON
      - name: Compile integration harness
        run: |
          npm ci
          npm run compile
      - name: Download one candidate VSIX
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: rc-candidate-vsix
          path: .candidate-vsix
      - name: Verify and use the exact packaged VSIX bytes
        run: |
          cd .candidate-vsix
          sha256sum --check candidate-vsix.sha256
          vsix="intentumdiff-$(node -p 'require("../package.json").version').vsix"
          test -f "$vsix"
          echo "INTENTUMDIFF_TEST_VSIX=$PWD/$vsix" >> "$GITHUB_ENV"
      - name: Install desktop test dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends xvfb scrot
      - name: Install capability media dependencies
        if: matrix.capture == 'capabilities'
        timeout-minutes: 20
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=45 -o Acquire::https::Timeout=45 install -y --no-install-recommends ffmpeg
      - name: Exercise installed extension bytes with real external engine
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' node out/test/integration/runRealTests.js
      - name: Retain actual evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-runtime-${{ matrix.runtime }}-${{ matrix.capture }}
          include-hidden-files: true
          path: |
            artifacts/real-runtime/
            .candidate-wheels/*.json
            .candidate-wheels/*.txt
            .candidate-wheels/*.sha256
            .candidate-native/*.json
            .candidate-native/SHA256SUMS
          if-no-files-found: warn

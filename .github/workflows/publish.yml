name: Publish extension

# Packages the extension and publishes it to the VS Code Marketplace and Open VSX.
#
# Tag-driven for a real release; workflow_dispatch offers a dry run that packages and
# validates the VSIX WITHOUT publishing, so the packaging path can be exercised before
# any token is configured or any version is burned.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and validate only - do not publish"
        required: false
        default: true
        type: boolean

# Deny by default (zizmor excessive-permissions): each job asks for exactly what it
# needs rather than inheriting a read-write repository default.
permissions: {}

jobs:
  package:
    name: Package VSIX
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install
        run: npm ci

      - name: Lint and test before packaging
        run: |
          npm run lint
          npm run test

      # A tag must agree with package.json, or the Marketplace listing and the git
      # history disagree about what shipped. Fail here rather than after publishing.
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GIT_TAG: ${{ github.ref_name }}
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GIT_TAG#v}"
          echo "package.json=$pkg  tag=$tag"
          if [ "$pkg" != "$tag" ]; then
            echo "::error::tag $tag does not match package.json $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npm run vsix

      - name: Verify the VSIX
        run: |
          shopt -s nullglob
          vsix=(*.vsix)
          if [ "${#vsix[@]}" -ne 1 ]; then
            echo "::error::expected exactly one .vsix, found ${#vsix[@]}" >&2
            exit 1
          fi
          echo "built ${vsix[0]} ($(du -h "${vsix[0]}" | cut -f1))"
          # The extension entry point must actually be inside the archive; vsce will
          # happily package an empty build if compilation silently produced nothing.
          # Read the path from package.json rather than hardcoding it: `main` is
          # ./out/src/extension.js here, not ./out/extension.js, and a hardcoded guess
          # fails the build for the wrong reason the moment the layout changes.
          entry=$(node -p "require('./package.json').main.replace(/^[.][/]/, '')")
          echo "package.json main -> $entry"
          unzip -l "${vsix[0]}" | grep -q "extension/${entry}" \
            || { echo "::error::VSIX contains no compiled entry point at extension/${entry}" >&2
                 echo "--- archive contents ---" >&2
                 unzip -l "${vsix[0]}" | head -40 >&2
                 exit 1; }
          sha256sum "${vsix[0]}" | tee "${vsix[0]}.sha256"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix
          path: |
            *.vsix
            *.vsix.sha256
          if-no-files-found: error

  scan:
    name: Malware scan the VSIX
    needs: package
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vsix

      - name: Scan the packaged VSIX with Microsoft Defender
        # A user reported Defender flagging the 0.0.1 download (#20). Three separate checks
        # since have found nothing, and the artefact contains no native binaries at all - so
        # the likeliest causes are SmartScreen reputation or a cloud ML heuristic on a
        # first-seen file, neither of which a scan here can rule out.
        #
        # What this step CAN do is make sure we never learn about a true positive from a user
        # again. windows-latest ships the same Defender engine that produced the report, so
        # this is the same engine that produced the report, not a proxy for it.
        #
        # Deliberately placed between packaging and publishing: scanning the exact bytes that
        # will be uploaded is the only version of this check worth having.
        shell: pwsh
        run: |
          $vsix = Get-ChildItem -Filter *.vsix | Select-Object -First 1
          if (-not $vsix) { Write-Error "no .vsix to scan"; exit 1 }
          Write-Host "scanning $($vsix.Name) ($($vsix.Length) bytes)"
          Write-Host "sha256: $((Get-FileHash $vsix.FullName -Algorithm SHA256).Hash)"

          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) {
            Write-Host "::warning::MpCmdRun.exe not present on this runner - scan skipped"
            exit 0
          }

          & $mp -SignatureUpdate | Out-Null
          $out = & $mp -Scan -ScanType 3 -File $vsix.FullName 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }

          # MpCmdRun returns 0 for "no threats" and 2 when it finds something. Trusting the
          # exit code alone has bitten before, so the output is checked too.
          if ($code -ne 0 -or ($out -join "`n") -match "found (a )?threat|Threat  *:") {
            Write-Error "Defender reported a threat in the VSIX - do NOT publish this build"
            exit 1
          }
          Write-Host "no threats found"

  publish:
    name: Publish to Marketplace + Open VSX
    needs: [package, scan]
    # Only on a tag, and never on a dispatch asking for a dry run.
    if: startsWith(github.ref, 'refs/tags/v') && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: marketplace
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Install
        run: npm ci

      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: vsix

      - name: Re-verify the downloaded checksum
        run: sha256sum --check ./*.vsix.sha256

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::VSCE_PAT is not set - add it to the 'marketplace' environment" >&2
            exit 1
          fi
          npx vsce publish --packagePath ./*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::warning::OVSX_PAT is not set - skipping Open VSX"
            exit 0
          fi

          # Open VSX requires the namespace to exist before anything can be published
          # into it, and it must equal package.json's `publisher` -- ovsx derives the
          # target from the VSIX itself, so a mismatch is not something a flag can fix.
          # Read it rather than hardcoding, so the two cannot drift apart.
          namespace=$(node -p "require('./package.json').publisher")
          echo "open vsx namespace: $namespace"

          # create-namespace is not idempotent: it errors once the namespace exists,
          # which is the normal state for every release after the first. Treat that as
          # success, but only that -- any other failure still fails the job.
          if npx ovsx create-namespace "$namespace" --pat "$OVSX_PAT" >ns.log 2>&1; then
            echo "namespace $namespace created"
          elif grep -qiE "already (exists|owned)|conflict" ns.log; then
            echo "namespace $namespace already exists"
          else
            echo "::error::could not create the Open VSX namespace $namespace" >&2
            cat ns.log >&2
            exit 1
          fi

          npx ovsx publish ./*.vsix --pat "$OVSX_PAT"
